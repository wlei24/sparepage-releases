name: Organize public repository
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/organize-repository.yml']
permissions:
  contents: write
concurrency:
  group: download-statistics
  cancel-in-progress: false
jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply website folders and preserve download history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, zlib
          base = 'https://api.github.com/repos/' + os.environ['REPO']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'SparePage-repository-organization'}
          def api(path, payload=None, method=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method or ('GET' if data is None else 'POST'))
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          patch = json.loads(zlib.decompress(base64.b64decode('')))
          head = api('/git/ref/heads/main')['object']['sha']
          commit = api('/git/commits/' + head)
          current = api('/git/trees/' + commit['tree']['sha'] + '?recursive=1')
          assert not current.get('truncated'), 'Tree too large; no changes made'
          entries = {e['path']: e['sha'] for e in current['tree']}
          for path, expected in patch['expected'].items():
              assert entries.get(path) == expected, 'File changed since preparation: ' + path
          changes = patch['tree_elements']
          # This one-time maintenance workflow removes itself after applying the reviewed layout.
          changes.append({'path': '.github/workflows/organize-repository.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': commit['tree']['sha'], 'tree': changes})
          result = api('/git/commits', {'message': 'Organize website, brand assets and documentation into folders', 'tree': tree['sha'], 'parents': [head]})
          api('/git/refs/heads/main', {'sha': result['sha'], 'force': False}, 'PATCH')
          print('Repository organized:', result['sha'])
          PY
